[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aire"
version = "0.1.0"
description = "Evidence-led reverse engineering investigations for iOS apps"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.16,<1", "rich>=14,<15", "mcp>=1.30,<2", "jsonschema>=4.23,<5", "tomlkit>=0.13,<1"]

[project.optional-dependencies]
ghidra = ["pyghidra>=3,<4"]
lief = ["lief>=0.17,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "PyYAML>=6,<7"]

[project.scripts]
aire = "aire.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aire = ["skills/**/SKILL.md", "skills/**/agents/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an external toolchain"]

[tool.ruff]
target-version = "py311"
line-length = 100
